<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TabWin Web — R00 Interaction Prototype</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header { display:flex; gap:1rem; align-items:center; justify-content:space-between; padding:1rem 1.25rem; border-bottom:1px solid currentColor; }
    header small { opacity:.7; }
    main { display:grid; grid-template-columns:minmax(260px, 320px) 1fr; min-height:calc(100vh - 68px); }
    aside { padding:1rem; border-right:1px solid currentColor; }
    section { padding:1.25rem; }
    .drop { border:2px dashed currentColor; border-radius:.75rem; padding:1.25rem; text-align:center; }
    button, input { font:inherit; }
    button { padding:.65rem .9rem; border-radius:.5rem; border:1px solid currentColor; cursor:pointer; }
    fieldset { margin:1rem 0; border-radius:.6rem; }
    label { display:block; margin:.55rem 0; }
    select { width:100%; padding:.55rem; }
    nav { display:flex; gap:.5rem; border-bottom:1px solid currentColor; padding-bottom:.75rem; }
    .panel { margin-top:1rem; border:1px solid currentColor; border-radius:.75rem; min-height:360px; padding:1rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.6rem; border-bottom:1px solid currentColor; }
    .muted { opacity:.7; }
    .status { padding:.6rem .8rem; border:1px solid currentColor; border-radius:.5rem; }
    @media (max-width: 780px) { main { grid-template-columns:1fr; } aside { border-right:0; border-bottom:1px solid currentColor; } }
  </style>
</head>
<body>
  <header>
    <div><strong>TabWin Web</strong> <small>R00 prototype — não oficial</small></div>
    <div class="status" id="status" role="status">Nenhum arquivo aberto</div>
  </header>
  <main>
    <aside aria-label="Construtor de análise">
      <div class="drop" id="drop">
        <strong>Abrir dados</strong>
        <p class="muted">Arraste DBC/DBF/DEF/CNV ou escolha um arquivo.</p>
        <input id="file" type="file" aria-label="Escolher arquivo local" />
      </div>
      <fieldset disabled id="builder">
        <legend>Tabulação</legend>
        <label>Linhas<select><option>Escolha uma variável</option></select></label>
        <label>Colunas<select><option>Opcional</option></select></label>
        <label>Conteúdo<select><option>Frequência</option></select></label>
        <label>Seleções<input type="search" placeholder="Pesquisar filtros…" /></label>
        <button type="button">Tabular</button>
      </fieldset>
    </aside>
    <section>
      <nav aria-label="Visualização">
        <button type="button">Tabela</button>
        <button type="button">Gráfico</button>
        <button type="button">Mapa</button>
        <button type="button">Auditoria</button>
      </nav>
      <div class="panel">
        <h1>Comece abrindo um arquivo</h1>
        <p>O protótipo R00 valida apenas o fluxo de interação. O decoder DBC real entra no spike R01.</p>
        <table aria-label="Metadados do arquivo" id="meta" hidden>
          <thead><tr><th>Campo</th><th>Valor</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
<script>
  const input = document.querySelector('#file');
  const drop = document.querySelector('#drop');
  const status = document.querySelector('#status');
  const meta = document.querySelector('#meta');
  const tbody = meta.querySelector('tbody');
  const builder = document.querySelector('#builder');

  function showFile(file) {
    const ext = file.name.includes('.') ? file.name.split('.').pop().toUpperCase() : '—';
    status.textContent = `${file.name} · ${ext} · ${(file.size/1024/1024).toFixed(2)} MB`;
    tbody.innerHTML = '';
    for (const [k,v] of [['Nome',file.name],['Formato',ext],['Tamanho',`${file.size} bytes`],['Última modificação',new Date(file.lastModified).toLocaleString('pt-BR')],['Processamento','local — protótipo sem upload']]) {
      const tr=document.createElement('tr');
      const th=document.createElement('th'); th.scope='row'; th.textContent=k;
      const td=document.createElement('td'); td.textContent=v;
      tr.append(th,td); tbody.append(tr);
    }
    meta.hidden=false;
    builder.disabled=false;
  }
  input.addEventListener('change', () => input.files[0] && showFile(input.files[0]));
  for (const ev of ['dragenter','dragover']) drop.addEventListener(ev, e => { e.preventDefault(); });
  drop.addEventListener('drop', e => { e.preventDefault(); const f=e.dataTransfer.files[0]; if(f) showFile(f); });
</script>
</body>
</html>
