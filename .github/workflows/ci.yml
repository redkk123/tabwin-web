name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TABWIN_WEB_HANDOFF_R01_2_VM_BOOTSTRAP_2026-08-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TABWIN_WEB_HANDOFF_R01_2_VM_BOOTSTRAP_2026-08-26/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run proxy:check
      # Only Chromium, and only its browser binary: the suite drives the app,
      # it does not test browser portability, and installing three engines
      # would triple the slowest step in CI for no extra signal.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: TABWIN_WEB_HANDOFF_R01_2_VM_BOOTSTRAP_2026-08-26/playwright-report
          retention-days: 7
