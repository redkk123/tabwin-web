name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TABWIN_WEB_HANDOFF_R01_2_VM_BOOTSTRAP_2026-08-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TABWIN_WEB_HANDOFF_R01_2_VM_BOOTSTRAP_2026-08-26/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run proxy:check
