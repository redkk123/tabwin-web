name: Verify and deploy TabWin Web

on:
  # Temporarily manual: the account currently rejects ordinary runners for a
  # billing lock. GitHub Pages is published from the isolated gh-pages branch.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TABWIN_WEB_HANDOFF_R01_2_VM_BOOTSTRAP_2026-08-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: TABWIN_WEB_HANDOFF_R01_2_VM_BOOTSTRAP_2026-08-26/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify kernel and web application
        run: npm run check
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: TABWIN_WEB_HANDOFF_R01_2_VM_BOOTSTRAP_2026-08-26/dist-web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
